# =============================================================
# Nginx config para la VPS - Coloca esto en la VPS en:
# /etc/nginx/sites-available/niacrmbot.com
# Y crea un symlink hacia sites-enabled:
# sudo ln -s /etc/nginx/sites-available/niacrmbot.com /etc/nginx/sites-enabled/
# =============================================================

# -----------------------------------------------
# 1. FRONTEND - https://niacrmbot.com:3001
# -----------------------------------------------
server {
    listen 3001;
    server_name niacrmbot.com www.niacrmbot.com;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -----------------------------------------------
# 2. BACKEND API - https://niacrmbot.com:8001
# -----------------------------------------------
server {
    listen 8001;
    server_name niacrmbot.com backend.niacrmbot.com;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -----------------------------------------------
# 3. WEBSOCKET - https://niacrmbot.com:3040
# -----------------------------------------------
server {
    listen 3040;
    server_name niacrmbot.com socket.niacrmbot.com;

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
