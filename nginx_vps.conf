# =============================================================
# Nginx config para la VPS - Coloca esto en la VPS en:
# /etc/nginx/sites-available/niacrmbot.com
# Y crea un symlink hacia sites-enabled:
# sudo ln -s /etc/nginx/sites-available/niacrmbot.com /etc/nginx/sites-enabled/
# =============================================================

# -----------------------------------------------
# 1. FRONTEND - https://niacrmbot.com (puerto 443)
# -----------------------------------------------
server {
    listen 80;
    server_name niacrmbot.com www.niacrmbot.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name niacrmbot.com www.niacrmbot.com;

    ssl_certificate     /etc/letsencrypt/live/niacrmbot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/niacrmbot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -----------------------------------------------
# 2. BACKEND API - https://niacrmbot.com:8001
# -----------------------------------------------
server {
    listen 8001 ssl;
    server_name niacrmbot.com;

    ssl_certificate     /etc/letsencrypt/live/niacrmbot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/niacrmbot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -----------------------------------------------
# 3. WEBSOCKET - https://niacrmbot.com:3040
# -----------------------------------------------
server {
    listen 3040 ssl;
    server_name niacrmbot.com;

    ssl_certificate     /etc/letsencrypt/live/niacrmbot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/niacrmbot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
