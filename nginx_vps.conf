# =============================================================
# Nginx config para la VPS - Coloca esto en la VPS en:
# /etc/nginx/sites-available/niacrmbot.com
# Y crea un symlink hacia sites-enabled:
# sudo ln -s /etc/nginx/sites-available/niacrmbot.com /etc/nginx/sites-enabled/
# =============================================================

# Frontend - niacrmbot.com (puerto 443 con SSL)
server {
    listen 80;
    server_name niacrmbot.com www.niacrmbot.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name niacrmbot.com www.niacrmbot.com;

    # SSL Certificates (ajusta las rutas si usas otro proveedor de SSL)
    ssl_certificate     /etc/letsencrypt/live/niacrmbot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/niacrmbot.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Proxy al contenedor del frontend (puerto 3001)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
