name: Deploy to VPS

on:
  push:
    branches:
      - main # O la rama que uses para producción

env:
  REGISTRY: ghcr.io

jobs:
  build-frontend-and-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Lowercase repository name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      # --- BACKEND DOCKER BUILD ---
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          labels: ${{ steps.meta.outputs.labels }}

      # --- FRONTEND LIGHTNING BUILD (NO DOCKER) ---
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Build Frontend React App
        env:
          REACT_APP_BACKEND_URL: http://109.205.179.98:8001
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build
        working-directory: ./frontend

      # --- FAST DEPLOY (SCP FRONTEND) ---
      - name: Copy Frontend Build to VPS via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: "frontend/build/*"
          target: "/root/Nia_CRM/frontend-build"
          strip_components: 2 # Removes the 'frontend/build' folders from target path

  deploy-backend:
    needs: build-frontend-and-backend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend to VPS (SSH)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /root/Nia_CRM
            
            # Forzamos descargar la versión más reciente anulando cualquier cambio local
            git fetch origin main
            git reset --hard origin/main
            
            # Loguearse en GHCR para actualizar backend
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Descargar imagen de backend actualizada (frontal ya no usa Docker build)
            docker compose pull nia-backend
            
            # Levantar y recrear contenedores que hayan cambiado de configuración (como el frontend con su nuevo volumen) o de imagen (backend)
            docker compose up -d --remove-orphans
            
            # (Opcional) Limpiar imágenes viejas
            docker image prune -a -f
