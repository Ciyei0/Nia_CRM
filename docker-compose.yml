version: "3.8"

services:
  nia-db:
    image: postgres:14
    container_name: nia_crm_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-whaticketsaas}
      POSTGRES_USER: ${DB_USER:-whaticket_user}
      POSTGRES_PASSWORD: ${DB_PASS:-mysql123456}
    ports:
      - "5433:5432"
    volumes:
      - nia_db_data:/var/lib/postgresql/data

  nia-redis:
    image: redis:alpine
    container_name: nia_crm_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - nia_redis_data:/data

  nia-backend:
    image: ghcr.io/ciyei0/nia_crm-backend:latest
    container_name: nia_crm_backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=8001
      - DB_DIALECT=postgres
      - DB_HOST=nia-db
      - DB_USER=${DB_USER:-whaticket_user}
      - DB_PASS=${DB_PASS:-mysql123456}
      - DB_NAME=${DB_NAME:-whaticketsaas}
      - DB_PORT=5432 # This is the internal port of nia-db
      - REDIS_URI=redis://nia-redis:6379 # Internal port of nia-redis
      - BACKEND_URL=${BACKEND_URL:-https://backend.niacrmbot.com}
      - FRONTEND_URL=${FRONTEND_URL:-https://niacrmbot.com}
      - PROXY_PORT=8001
      - FACEBOOK_APP_ID=1502878444119560
      - FACEBOOK_APP_SECRET=a779858498ded3069dd08271f7d90f12
      # ... you will need to map other variables from .env here
      - JWT_SECRET=T87UxFqVDmDbol+l3kJPw1BIfUD+V2D0uSMxiVBCeJEE5B7S//YJ62TmrlBAqhe3etLamUk87ZoYCzLSIEI+ag==
      - JWT_REFRESH_SECRET=dBSXqFg9TaNUEDXVp6fhMTRLBysP+j2DSqf7+raxD3A=
      - SUPABASE_URL=https://sucaqyptfxcykheekhqg.supabase.co
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1Y2FxeXB0ZnhjeWtoZWVraHFnIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NDMxNjc2OCwiZXhwIjoyMDg5ODkyNzY4fQ.Ng9PIxrXzKwMUJu7MnpCz6qc9VA3pIlmrHALIcSl708
    ports:
      - "8081:8001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nia-backend.rule=Host(`backend.niacrmbot.com`)"
      - "traefik.http.routers.nia-backend.entrypoints=https"
      - "traefik.http.routers.nia-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.nia-backend.loadbalancer.server.port=8001"
      - "traefik.docker.network=easypanel"
    networks:
      - default
      - easypanel
    depends_on:
      - nia-db
      - nia-redis

  nia-frontend:
    image: ghcr.io/ciyei0/nia_crm-frontend:latest
    container_name: nia_crm_frontend
    restart: always
    ports:
      - "127.0.0.1:3010:3001" # Internal mapping for Nginx proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nia-front.rule=Host(`niacrmbot.com`)"
      - "traefik.http.routers.nia-front.entrypoints=https"
      - "traefik.http.routers.nia-front.tls.certresolver=letsencrypt"
      - "traefik.http.services.nia-front.loadbalancer.server.port=3001"
      - "traefik.docker.network=easypanel"
    networks:
      - default
      - easypanel
    depends_on:
      - nia-backend
    volumes:
      - ./frontend-build:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  nia_db_data:
  nia_redis_data:

networks:
  default:
  easypanel:
    external: true
